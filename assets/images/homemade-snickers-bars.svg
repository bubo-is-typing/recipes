<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">Layered homemade chocolate bars</title><desc id="desc">Stacked cut chocolate bars reveal creamy cashew base, golden peanut caramel and roasted peanuts beneath a dark chocolate shell.</desc>
