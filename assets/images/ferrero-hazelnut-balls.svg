<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">Hazelnut chocolate balls still life</title><desc id="desc">Whole and cut-open chocolate hazelnut confections with a creamy nougat and crunchy centre, scattered hazelnuts and chocolate shards.</desc>
