<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">Peanut butter oat cups</title><desc id="desc">Two rustic oat cups filled with banana and Greek yogurt, finished with looping peanut butter drizzle and scattered rolled oats.</desc>
