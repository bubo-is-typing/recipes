<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">Crispy tomato and olive oil bread</title><desc id="desc">Three slices of toasted bread topped with grated tomato, red onion, parsley and pine nuts on a pale ceramic plate.</desc>
